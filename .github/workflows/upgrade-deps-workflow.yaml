---
name: Upgrade Dependencies
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.OAPICF_GITHUB_TOKEN }}
      - uses: cliffano/command-docker-action@v2.1.0
        with:
          command: 'make update-to-latest && make update-dotfiles update-partials'
          image: cliffano/studio:4.0.0
      - uses: cliffano/command-docker-action@v2.1.0
        with:
          command: 'make deps-upgrade'
          image: cliffano/studio:4.0.0
      - uses: iamsauravsharma/create-dotenv@v2.0.1
        with:
          file-path: '/tmp/.env'
        env:
          GITHUB_ACTIONS: ${{ env.GITHUB_ACTIONS }}
      - uses: cliffano/command-docker-action@v2.1.0
        with:
          command: 'make ci'
          image: cliffano/studio:4.0.0
          env_file: '/tmp/.env'
      - uses: cliffano/save-changes-action@v2.0.0
        with:
          message: "Upgrade dependencies to latest"
          github_token: ${{ secrets.OAPICF_GITHUB_TOKEN }}